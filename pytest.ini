[pytest]
# --doctest-modules turns every worked example in a docstring into a real
# test. That is deliberate: in this project the docstrings ARE the spec
# handed over before a function is implemented, so they must stay true.
# A drifting example is a lying spec.
#
# Run everything:        .venv\Scripts\python.exe -m pytest
# Just the metrics:      .venv\Scripts\python.exe -m pytest src/ingest/quality.py
addopts = --doctest-modules -q
testpaths = src evaluation
