<script>
const ITEMS = [{"id": "llama3.2:3b|extra-024", "question": "Why does Jurafsky say that a complicated question-answering task may require more than a search engine, and what additional operations does the text identify?", "answer": "[S1] According to Jurafsky, a complicated question-answering task may require more than a search engine because it often involves extracting information that is embedded in other text, doing inference, or synthesizing and summarizing information from multiple sources or web pages.\n\n[S2] The text identifies additional operations that may be required, including query expansion, passage retrieval, and answer processing. Specifically, it mentions that query expansion methods can add query terms to the query to match the particular form of the answer, and that passage retrieval involves filtering out passages that don't contain potential answers and ranking the rest according to how likely they are to contain an answer to the question.", "citations": [{"sid": "S1", "cite": "Jurafsky, I: WORDS > 1.1 KNOWLEDGE IN SPEECH AND LANGUAGE PROCESSING, PDF p. 2", "text": "1.\nIntroduction\n• What does “divergent” mean?\n• What year was Abraham Lincoln born?\n• How many states were in the United States that year?\n• How much Chinese silk was exported to England by the end of the 18th century?\n• What do scientists think about the ethics of human cloning?\nSome of these, such as deﬁnition questions, or simple factoid questions like dates\nand locations, can already be answered by search engines. But answering more complicated questions might require extracting information that is embedded in other text\non a Web page, or doing inference (drawing conclusions based on known facts), or\nsynthesizing and summarizing information from multiple sources or web pages. In this\ntext we study the various components that make up modern understanding systems of\nthis kind, including information extraction, word sense disambiguation, and so on.\nAlthough the subﬁelds and problems we’ve described above are all very far from\ncompletely solved, these are all very active research areas and many technologies are\nalready available commercially. In the rest of this chapter we brieﬂy summarize the\nkinds of knowledge that is necessary for these tasks (and others like spell correction,\ngrammar checking, and so on), as well as the mathematical models that will be introduced throughout the book.\n1.1\nKNOWLEDGE IN SPEECH AND LANGUAGE PROCESSING\nWhat distinguishes language processing applications from other data processing systems is their use of knowledge of language. Consider the Unix wc program, which is\nused to count the total number of bytes, words, and lines in a text ﬁle. When used to\ncount bytes and lines, wc is an ordinary data processing application. However, when it\nis used to count the words in a ﬁle it requires knowledge about what it means to be a\nword, and thus becomes a language processing system.\nOf course, wc is an extremely simple system with an extremely limited and impoverished knowledge of language. Sophisticated conversational agents like HAL,\nor machine translation systems, or robust question-answering systems, require much\nbroader and deeper knowledge of language. To get a feeling for the scope and kind of\nrequired knowledge, consider some of what HAL would need to know to engage in the\ndialogue that begins this chapter, or for a question answering system to answer one of\nthe questions above.\nHAL must be able to recognize words from an audio signal and to generate an"}, {"sid": "S2", "cite": "Jurafsky, 23.2 FACTOID QUESTION ANSWERING > 23.2.1 Question Processing, PDF p. 899", "text": "stopwords. Often we leave out the question word (where, when, etc). Alternatively,\nkeywords can be formed from only the terms found in the noun phrases in the question, applying stopword lists to ignore function words and high-frequency, low-content\nverbs.\nWhen question answering is applied to smaller sets of documents, for example to\nanswer questions about corporate information pages, we still use an IR engine to search\nour documents for us. But for this smaller set of documents we generally need to apply\nquery expansion. On the Web the answer to a question might appear in many different\nforms, and so if we search with words from the question we’ll probably ﬁnd an answer\nwritten in the same form. In smaller sets of corporate pages, by contrast, an answer\nmight appear only once, and the exact wording might look nothing like the question.\nThus query expansion methods can add query terms hoping to match the particular\nform of the answer as it appears.\nThus we might add to the query all morphological variants of the content words in\nthe question, as well as applying the thesaurus-based or other query expansion algorithms discussed in the previous section to get a larger set of keywords for the query.\nMany systems use WordNet as a thesaurus, while others rely on special-purpose thesauruses that are speciﬁcally hand-built for question-answering.\nAnother query formulation approach that is sometimes used when questioning the\nWeb is to apply a set of query reformulation rules to the query. The rules rephrase the\nQUERY\nREFORMULATION\nquestion to make it look like a substring of possible declarative answers. For example\nthe question “when was the laser invented?” would be reformulated as the laser was\n\n\nSection 23.2.\nFactoid Question Answering\n17\ninvented; the question “where is the Valley of the Kings?” might be reformulated as\n“the Valley of the Kings is located in”. We can apply multiple such rules to the query,\nand pass all the resulting reformulated queries to the web search engine. Here are some\nsample hand-written reformulation rules from Lin (2007):\n(23.19)\nwh-word did A verb B →...A verb+ed B\n(23.20)\nWhere is A →A is located in\nQuestion Classiﬁcation"}]}, {"id": "gpt-oss:20b-cloud|cand-019", "question": "When sweeping an ordered numeric hyperparameter such as learning rate, how does Goodfellow recommend spacing the candidate values?", "answer": "Goodfellow suggests using a logarithmic spacing for ordered numeric hyperparameters. For example, a learning‑rate sweep might use values such as {0.1, 0.01, 10⁻³, 10⁻⁴, 10⁻⁵}—i.e., roughly evenly spaced on a log scale. [S1]", "citations": [{"sid": "S1", "cite": "Goodfellow, 11 Practical Methodology > 11.4 Selecting Hyperparameters, p. 434", "text": "ﬁgure\nfor an illustration of a grid of hyperparameter values.\n11.2\nHow should the lists of values to search over be chosen? In the case of numerical\n(ordered) hyperparameters, the smallest and largest element of each list is chosen\nconservatively, based on prior experience with similar experiments, to make sure\nthat the optimal value is very likely to be in the selected range. Typically, a grid\nsearch involves picking values approximately on a logarithmic scale, e.g., a learning\nrate taken within the set {.1, .01, 10−3, 10−4,10−5}, or a number of hidden units\ntaken with the set\n.\n{\n}\n50 100 200 500 1000 2000\n,\n,\n,\n,\n,\nGrid search usually performs best when it is performed repeatedly. For example,\nsuppose that we ran a grid search over a hyperparameter α using values of {−1, 0,1}.\nIf the best value found is\n, then we underestimated the range in which the best\n1\nα\nlies and we should shift the grid and run another search with α in, for example,\n{1,2, 3}. If we ﬁnd that the best value of α is\n, then we may wish to reﬁne our\n0\nestimate by zooming in and running a grid search over\n.\n{−\n}\n. , , .\n1 0 1\nThe obvious problem with grid search is that its computational cost grows\nexponentially with the number of hyperparameters. If there are m hyperparameters,\neach taking at most n values, then the number of training and evaluation trials\nrequired grows as O(nm). The trials may be run in parallel and exploit loose\nparallelism (with almost no need for communication between diﬀerent machines\ncarrying out the search) Unfortunately, due to the exponential cost of grid search,\neven parallelization may not provide a satisfactory size of search.\n11.4.4\nRandom Search\nFortunately, there is an alternative to grid search that is as simple to program, more\nconvenient to use, and converges much faster to good values of the hyperparameters:\nrandom search (\n,\n).\nBergstra and Bengio 2012\nA random search proceeds as follows. First we deﬁne a marginal distribution"}]}, {"id": "llama3.2:3b|extra-014", "question": "How do Jurafsky's treatment of morphology and Raschka's BPE tokenization differ in the kinds of units they create from language, and what problem is each abstraction meant to address?", "answer": "[S1][S4] According to Jurafsky (2001), signatures are used to represent slightly more complexity in morphological representations, where a signature is a list of sufﬁxes that can appear with a particular stem. In contrast, Raschka (2022) uses byte pair encoding (BPE) to create units from language, where BPE breaks down words that aren’t in its predefined vocabulary into smaller subword units or even individual characters.", "citations": [{"sid": "S1", "cite": "Jurafsky, 11.5 LEARNING PHONOLOGY & MORPHOLOGY > 11.5.2 Learning Morphology, PDF p. 422", "text": "true complexity of morphological representations, since in reality not every word is\ncombinable with every afﬁx. One way to represent slightly more complexity is to use\nsignatures. A signature is a list of sufﬁxes that can appear with a particular stem. Here\nSIGNATURES\nare some sample signatures from Goldsmith (2001):\nSignature\nExample\nNULL.ed.ing.s remain remained remaining remains\nNULL.s\ncow cows\ne.ed.es.ing\nnotice noticed notices noticing\nThe Goldsmith (2001) version of MDL considers all possible segmentations of\nevery word into a stem and a sufﬁx. It then chooses the set of segmentations for the\nwhole corpus that jointly minimize the compressed length of the corpus and the length\nof the model. The length of the model is the sum of the lengths of the afﬁxes, the stems,\nand the signatures. The length of the corpus is computed by using the model to assign\na probability to the corpus and using this probably to compute the cross-entropy of the\ncorpus given the model.\nWhile approaches based solely on stem and afﬁx statistics like MDL have been\nquite successful in morphological learning, they do have a number of limitations.\nFor example Schone and Jurafsky (2000, 2001) noted in an error analysis that MDL\nsometimes segments valid afﬁxes inappropriately (such as segmenting the word ally\nto all+y), or fails to segment valid but non-productive afﬁxes (missing the relationship between dirt and dirty). They argued that such problems stemmed from a lack\nof semantic or syntactic knowledge, and showed how to use relatively simple semantic\nfeatures to address them. The Schone and Jurafsky (2000) algorithm uses a trie to come\nup with “pairs of potential morphological variants”, (PPMVs) words which differ only\nin potential afﬁxes. For each pair, they compute the semantic similarity between the\nwords, using the Latent Semantic Analysis (LSA) algorithm of Ch. 23. LSA is an unsupervised model of word similarity which is induced directly from the distributions of\nword in context. Schone and Jurafsky (2000) showed that using the semantic similarity\nalone was at least as good a predictor of morphological structure as MDL. The table"}, {"sid": "S4", "cite": "Jurafsky, 3 WORDS & TRANSDUCERS > 3.1 SURVEY OF (MOSTLY) ENGLISH MORPHOLOGY, PDF p. 53", "text": "Morphology is the study of the way words are built up from smaller meaning-bearing\nunits, morphemes. A morpheme is often deﬁned as the minimal meaning-bearing unit\nMORPHEMES\nin a language. So for example the word fox consists of a single morpheme (the morpheme fox) while the word cats consists of two: the morpheme cat and the morpheme\n-s.\nAs this example suggests, it is often useful to distinguish two broad classes of\nmorphemes: stems and afﬁxes. The exact details of the distinction vary from language\nSTEMS\nAFFIXES\nto language, but intuitively, the stem is the “main” morpheme of the word, supplying\nthe main meaning, while the afﬁxes add “additional” meanings of various kinds.\nAfﬁxes are further divided into preﬁxes, sufﬁxes, inﬁxes, and circumﬁxes. Preﬁxes precede the stem, sufﬁxes follow the stem, circumﬁxes do both, and inﬁxes are\ninserted inside the stem. For example, the word eats is composed of a stem eat and\nthe sufﬁx -s. The word unbuckle is composed of a stem buckle and the preﬁx un-. English doesn’t have any good examples of circumﬁxes, but many other languages do.\nIn German, for example, the past participle of some verbs is formed by adding ge- to\nthe beginning of the stem and -t to the end; so the past participle of the verb sagen (to\nsay) is gesagt (said). Inﬁxes, in which a morpheme is inserted in the middle of a word,\n2\nLemmatization is actually more complex, since it sometimes involves deciding on which sense of a word\nis present. We return to this issue in Ch. 20."}]}, {"id": "llama3.2:3b|cand-025", "question": "In Jurafsky's Levenshtein setup, what unit cost is assigned to an insertion operation?", "answer": "[S5] Jurafsky, 3 WORDS & TRANSDUCERS > 3.11 MINIMUM EDIT DISTANCE, PDF p. 80\n\nIn Jurafsky's Levenshtein setup, the unit cost assigned to an insertion operation is 1.", "citations": [{"sid": "S5", "cite": "Jurafsky, 3 WORDS & TRANSDUCERS > 3.11 MINIMUM EDIT DISTANCE, PDF p. 80", "text": "which are the likely source of the errorful form. For example, correcting the spelling\nerror graffe requires searching through all possible words like giraffe, graf, craft, grail,\netc, to pick the most likely source. To choose among these potential sources we need a\ndistance metric between the source and the surface error. Intuitively, giraffe is a more\nlikely source than grail for graffe, because giraffe is closer in spelling to graffe than\ngrail is to graffe. The most powerful way to capture this similarity intuition requires\nthe use of probability theory and will be discussed in Ch. 4. The algorithm underlying\nthis solution, however, is the non-probabilistic minimum edit distance algorithm that\nwe introduce in the next section.\n3.11\nMINIMUM EDIT DISTANCE\nDeciding which of two words is closer to some third word in spelling is a special case of\nthe general problem of string distance. The distance between two strings is a measure\nDISTANCE\nof how alike two strings are to each other.\n5\nEarly spelling error detectors for English, by contrast, simply allowed any word to have any sufﬁx – thus\nUnix SPELL accepts bizarre preﬁxed words like misclam and antiundoggingly and sufﬁxed words based on\nthe like thehood and theness.\n\n\nSection 3.11.\nMinimum Edit Distance\n31\nMany important algorithms for ﬁnding string distance rely on some version of the\nminimum edit distance algorithm, named by Wagner and Fischer (1974) but indepen-\nMINIMUM EDIT\nDISTANCE\ndently discovered by many people; see the History section of Ch. 6 for a discussion\nof the history of these algorithms. The minimum edit distance between two strings is\nthe minimum number of editing operations (insertion, deletion, substitution) needed to\ntransform one string into another. For example the gap between the words intention\nand execution is ﬁve operations, shown in Fig. 3.23 as an alignment between the two\nALIGNMENT\nstrings. Given two sequences, an alignment is a correspondance between substrings of\nthe two sequences. Thus I aligns with the empty string, N with E, T with X, and so on.\nBeneath the aligned strings is another representation; a series of symbols expressing an\noperation list for converting the top string into the bottom string; d for deletion, s for"}]}, {"id": "llama3.2:3b|cand-036", "question": "How can the variational lower bound be used to choose the number of Gaussian-mixture components, and why does label-switching not distort that choice?", "answer": "[S1][S3] According to Bishop (10.2.4), the variational lower bound can be used to determine the optimal number of components in the mixture model by maximizing the lower bound with respect to the number of components K.\n\n[S1] Bishop also states that the variational treatment opens up the possibility of determining the optimal number of components in the mixture without resorting to techniques such as cross-validation.\n\n[S2] Bishop (10.2.2) discusses the use of the variational lower bound to choose the number of Gaussian-mixture components, and notes that the choice is not distorted by label-switching.\n\n[S1] Bishop further states that the variational treatment provides a deeper test of the correctness of both the mathematical derivation of the update equations and of their software implementation by using finite differences to check that each update does indeed give a (constrained) maximum of the bound.\n\nTherefore, the variational lower bound can be used to choose the number of Gaussian-mixture components by maximizing the lower bound with respect to the number of components K, and label-switching does not distort this choice.", "citations": [{"sid": "S1", "cite": "Bishop, 10.2. Illustration: Variational Mixture of Gaussians > 10.2.2 Variational lower bound, p. 481", "text": "10.2. Illustration: Variational Mixture of Gaussians\nIndeed, these singularities are removed if we simply introduce a prior and then use a\nMAP estimate instead of maximum likelihood. Furthermore, there is no over-ﬁtting\nif we choose a large number K of components in the mixture, as we saw in Figure 10.6. Finally, the variational treatment opens up the possibility of determining\nthe optimal number of components in the mixture without resorting to techniques\nsuch as cross validation.\nSection 10.2.4\n10.2.2\nVariational lower bound\nWe can also straightforwardly evaluate the lower bound (10.3) for this model.\nIn practice, it is useful to be able to monitor the bound during the re-estimation in\norder to test for convergence. It can also provide a valuable check on both the mathematical expressions for the solutions and their software implementation, because at\neach step of the iterative re-estimation procedure the value of this bound should not\ndecrease. We can take this a stage further to provide a deeper test of the correctness\nof both the mathematical derivation of the update equations and of their software implementation by using ﬁnite differences to check that each update does indeed give\na (constrained) maximum of the bound (Svens´en and Bishop, 2004).\nFor the variational mixture of Gaussians, the lower bound (10.3) is given by\nL\n=\n\u0002\nZ\n\u0006\u0006\u0006\nq(Z, π, µ, Λ) ln\n\fp(X, Z, π, µ, Λ)\nq(Z, π, µ, Λ)\n\r\ndπ dµ dΛ\n=\nE[ln p(X, Z, π, µ, Λ)] −E[ln q(Z, π, µ, Λ)]\n=\nE[ln p(X|Z, µ, Λ)] + E[ln p(Z|π)] + E[ln p(π)] + E[ln p(µ, Λ)]\n−E[ln q(Z)] −E[ln q(π)] −E[ln q(µ, Λ)]\n(10.70)\nwhere, to keep the notation uncluttered, we have omitted the ⋆superscript on the\nq distributions, along with the subscripts on the expectation operators because each"}, {"sid": "S3", "cite": "Bishop, 10.2. Illustration: Variational Mixture of Gaussians > 10.2.4 Determining the number of components, p. 483", "text": "distribution (10.81) reduces to a mixture of Gaussians.\nExercise 10.20\n10.2.4\nDetermining the number of components\nWe have seen that the variational lower bound can be used to determine a posterior distribution over the number K of components in the mixture model. There\nSection 10.1.4\nis, however, one subtlety that needs to be addressed. For any given setting of the\nparameters in a Gaussian mixture model (except for speciﬁc degenerate settings),\nthere will exist other parameter settings for which the density over the observed variables will be identical. These parameter values differ only through a re-labelling of\nthe components. For instance, consider a mixture of two Gaussians and a single observed variable x, in which the parameters have the values π1 = a, π2 = b, µ1 = c,\nµ2 = d, σ1 = e, σ2 = f. Then the parameter values π1 = b, π2 = a, µ1 = d,\nµ2 = c, σ1 = f, σ2 = e, in which the two components have been exchanged, will\nby symmetry give rise to the same value of p(x). If we have a mixture model comprising K components, then each parameter setting will be a member of a family of\nK! equivalent settings.\nExercise 10.21\nIn the context of maximum likelihood, this redundancy is irrelevant because the\nparameter optimization algorithm (for example EM) will, depending on the initialization of the parameters, ﬁnd one speciﬁc solution, and the other equivalent solutions play no role. In a Bayesian setting, however, we marginalize over all possible\n\n\n10. APPROXIMATE INFERENCE\nFigure 10.7\nPlot of the variational lower bound\nL versus the number K of components in the Gaussian mixture\nmodel, for the Old Faithful data,\nshowing a distinct peak at K =\n2 components.\nFor each value\nof K, the model is trained from\n100 different random starts, and\nthe results shown as ‘+’ symbols\nplotted with small random horizontal perturbations so that they\ncan be distinguished.\nNote that\nsome solutions ﬁnd suboptimal\nlocal maxima, but that this happens infrequently.\nK\np(D|K)\n1\n2\n3\n4\n5\n6"}, {"sid": "S2", "cite": "Bishop, 10. Approximate Inference > Exercises, p. 520", "text": "Consider a variational Gaussian mixture model in which there is no\nprior distribution over mixing coefﬁcients {πk}. Instead, the mixing coefﬁcients are\ntreated as parameters, whose values are to be found by maximizing the variational\nlower bound on the log marginal likelihood. Show that maximizing this lower bound\nwith respect to the mixing coefﬁcients, using a Lagrange multiplier to enforce the\nconstraint that the mixing coefﬁcients sum to one, leads to the re-estimation result\n(10.83). Note that there is no need to consider all of the terms in the lower bound but\nonly the dependence of the bound on the {πk}.\n10.24\n(⋆⋆) www\nWe have seen in Section 10.2 that the singularities arising in the maximum likelihood treatment of Gaussian mixture models do not arise in a Bayesian\ntreatment. Discuss whether such singularities would arise if the Bayesian model\nwere solved using maximum posterior (MAP) estimation.\n10.25\n(⋆⋆)\nThe variational treatment of the Bayesian mixture of Gaussians, discussed in\nSection 10.2, made use of a factorized approximation (10.5) to the posterior distribution. As we saw in Figure 10.2, the factorized assumption causes the variance of the\nposterior distribution to be under-estimated for certain directions in parameter space.\nDiscuss qualitatively the effect this will have on the variational approximation to the\nmodel evidence, and how this effect will vary with the number of components in\nthe mixture. Hence explain whether the variational Gaussian mixture will tend to\nunder-estimate or over-estimate the optimal number of components.\n10.26\n(⋆⋆⋆)\nExtend the variational treatment of Bayesian linear regression to include\na gamma hyperprior Gam(β|c0, d0) over β and solve variationally, by assuming a\nfactorized variational distribution of the form q(w)q(α)q(β). Derive the variational\nupdate equations for the three factors in the variational distribution and also obtain\nan expression for the lower bound and for the predictive distribution.\n10.27\n(⋆⋆) By making use of the formulae given in Appendix B show that the variational"}]}, {"id": "gpt-oss:20b-cloud|extra-023", "question": "Why does Huyen describe ensembling as common in ML competitions but less common in production systems?", "answer": "Ensembling is popular in competitions because it can give a small accuracy boost that is worth the extra effort. However, Huyen notes that in production the added complexity hurts deployment and maintenance: ensembles are slower to make predictions, harder to interpret, and more difficult to update or debug. Production systems prioritize low latency, simplicity, and reliability, so the marginal performance gain from an ensemble is often not worth the extra cost. Thus ensembles are common in contests but less common in production where speed, maintainability, and interpretability matter more. [S1][S3][S4]", "citations": [{"sid": "S1", "cite": "Huyen, Understanding Machine Learning Systems > Machine learning in research vs. in production, PDF p. 29", "text": "by the product team: they both can’t return restaurant recommendations in\nless than 100 milliseconds.\nWhen developing an ML project, it’s important for ML engineers to\nunderstand requirements from all stakeholders involved and how strict these\nrequirements are. For example, if being able to return recommendations\nwithin 100 milliseconds is a must-have requirement — the company finds\nthat if your model takes over 100 milliseconds to recommend restaurants,\n10% of users would lose patience and close the app — then neither model\nA and B will work. However, if it’s just a nice-to-have requirement, you\nmight still want to consider model A or model B.\nProduction having different requirements from research is one of the\nreasons why successful research projects might not always be used in\nproduction. For example, ensembling is a technique popular among the\nwinners of many ML competitions, including the famed $1M Netflix Prize,\nand yet it’s not widely used in production. Ensembling combines “multiple\nlearning algorithms to obtain better predictive performance than could be\nobtained from any of the constituent learning algorithms alone.\n” While it\ncan give your ML system a small performance improvement, ensembling\ntends to make a system too complex to be useful in production, e.g. slower\nto make predictions or harder to interpret the results.\nFor many tasks, a small improvement in performance can result in a huge\nboost in revenue or cost savings. For example, a 0.2% improvement in the\nclick-through-rate for a product recommendation system can result in\nmillions of dollars increase in revenue for an ecommerce site. However, for\nmany tasks, a small improvement might not be noticeable for users. From a\nuser’s point of view, a speech recognition app with a 95% accuracy is not\nthat different from an app with a 95.2% accuracy. For the second type of\ntasks, if a simple model can do a reasonable job, complex models must\nperform significantly better to justify the complexity."}, {"sid": "S3", "cite": "Huyen, Model Development and Training > Ensembles, PDF p. 193", "text": "assumption that it’s tractable to compute the probability\nP(Z|X).\nBoundaries: A linear classifier assumes that decision\nboundaries are linear.\nConditional independence: A Naive Bayes classifier\nassumes that the attribute values are independent of each\nother given the class.\nNormally distributed: many statistical methods assume\nthat data is normally distributed.\nEnsembles\nWhen considering an ML solution to your problem, you might want to start\nwith a system that contains just one model, and the process of selecting one\nmodel for your problem is discussed above. After you’ve deployed your\nsystem, you might think about how to continue improving its performance.\nOne method that has consistently given your system a performance boost is\nto use an ensemble of multiple models instead of just an individual model to\nmake predictions. Each model in the ensemble is called a base learner. For\nexample, for the task of predicting whether an email is SPAM or NOT\nSPAM, you might have 3 different models. The final prediction for each\nemail is the majority vote of all these three models. So if at least two base\nlearners output SPAM, the email will be classified as SPAM.\n20 out of 22 winning solutions on Kaggle competitions in 2021, as of\nAugust 2021, use ensembles . An example of an ensemble used for a\nKaggle competition is shown in Figure 5-5. As of January 2022, 20 top\nsolutions on SQuAD 2.0, the Stanford Question Answering Dataset, are\nensembles, as shown in Figure 5-6.\n\n\nFigure 5-5. The ensemble used in the top solution for the Cassava Leaf Disease Classification\ncompetition on Kaggle. Image by Jannis Hanke.\nEnsembling methods are less favored in production because ensembles are\nmore complex to deploy and harder to maintain. However, they are still\ncommon for tasks where a small performance boost can lead to a huge\nfinancial gain such as predicting click-through rate (CTR) for ads."}, {"sid": "S4", "cite": "Huyen, Model Development and Training > Ensembles, PDF p. 193", "text": "Figure 5-5. The ensemble used in the top solution for the Cassava Leaf Disease Classification\ncompetition on Kaggle. Image by Jannis Hanke.\nEnsembling methods are less favored in production because ensembles are\nmore complex to deploy and harder to maintain. However, they are still\ncommon for tasks where a small performance boost can lead to a huge\nfinancial gain such as predicting click-through rate (CTR) for ads.\n\n\n\n\nFigure 5-6. As of January 2022, top 20 solutions on SQuAD 2.0 are all ensembles.\nWe’ll go over an example to give you the intuition of why ensembling\nworks. Imagine you have three email spam classifiers, each with an\naccuracy of 70%. Assuming that each classifier has an equal probability of\nmaking a correct prediction for each email, and that these three classifiers\nare not correlated, we’ll show that by taking the majority vote of these three\nclassifiers, we can get an accuracy of 78.4%.\nFor each email, each classifier has a 70% chance of being correct. The\nensemble will be correct if at least 2 classifiers are correct. Table 5-1 shows\nthe probabilities of different possible outcomes of the ensemble given an\nemail. This ensemble will have an accuracy of 0.343 + 0.441 = 0.784, or\n78.4%.\n\n\n \n            \nT\na\nb\nl\ne\n \n5\n-\n1\n. \nP\no\ns\ns\ni\nb\nl\ne\n \no\nu\nt\nc\no\nm\ne\ns\n \no\nf \nt\nh\ne\n\n\n \ne\nn\ns\ne\nm\nb\nl\ne\n \nt\nh\na\nt \nt\na\nk\ne\ns\n \nt\nh\ne\n \nm\na\nj\no\nr\ni\nt\ny\n \nv\no\nt"}]}, {"id": "gpt-oss:20b-cloud|cand-064", "question": "For importance sampling on retained old-policy events, what support condition must the proposal distribution satisfy, and why does event retention matter?", "answer": "The proposal (old‑policy) distribution **must have support that covers the target**:  \n\\(Q(x)>0\\) whenever \\(P(x)\\neq0\\) so that every event that can occur under the new policy can be represented by a retained old‑policy sample [S6].  \n\nEvent retention matters because importance sampling reweights the **retained** samples; discarding them would remove the data needed to compute the weights and thus destroy the estimator’s validity. In importance sampling all generated samples are kept for weighting [S5].", "citations": [{"sid": "S6", "cite": "Huyen, Sampling > Reservoir Sampling, PDF p. 102", "text": "“importance” to training samples. Samples with higher weights affect the loss function more. Changing sample\nweights can change your model’s decision boundaries significantly, as shown in Figure 3-1.\nFigure 3-1. How sample weights can affect the decision boundary. On the left is when all samples are given equal weights. On the right is when\nsamples are given different weights. Source: SVM: Weighted samples (sklearn).\nImportance Sampling\nImportance sampling is one of the most important sampling methods, not just in ML. It allows us to sample\nfrom a distribution when we only have access to another distribution.\nImagine you have to sample x from a distribution P(x), but P(x) is really expensive, slow, or infeasible to\nsample from. However, you have a distribution Q(x) that is a lot easier to sample from. So you sample x from \nQ(x) instead and weight this sample by P(x)\nQ(x) Q(x) is called the proposal distribution or the importance\ndistribution. Q(x) can be any distribution as long as Q(x) > 0 whenever P(x) ≠0. The equation below shows\nthat in expectation, x sampled from P(X) is equal to x sampled from Q(x) weighted by P(x)\nQ(x) .\nEP(x) [x] = ∑x P (x)x = ∑x Q (x)x P(x)\nQ(x) = EQ(x) [x P(x)\nQ(x) ]\nOne example where importance sampling is used in ML is policy-based reinforcement learning. Consider the\ncase when you want to update your policy. You want to estimate the value functions of the new policy, but\ncalculating the total rewards of taking an action can be costly because it requires considering all possible\noutcomes until the end of the time horizon after that action. However, if the new policy is relatively close to the\nold policy, you can calculate the total rewards based on the old policy instead and reweight them according to\nthe new policy. The rewards from the old policy make up the proposal distribution.\nReservoir Sampling"}, {"sid": "S5", "cite": "Bishop, 11.1. Basic Sampling Algorithms > 11.1.4 Importance sampling, p. 532", "text": "in Figure 11.8. We can then express the expectation in the form of a ﬁnite sum over\n\n\n11.1. Basic Sampling Algorithms\nsamples {z(l)} drawn from q(z)\nE[f]\n=\n\u0006\nf(z)p(z) dz\n=\n\u0006\nf(z)p(z)\nq(z)q(z) dz\n≃\n1\nL\nL\n\u0002\nl=1\np(z(l))\nq(z(l))f(z(l)).\n(11.19)\nThe quantities rl = p(z(l))/q(z(l)) are known as importance weights, and they correct the bias introduced by sampling from the wrong distribution. Note that, unlike\nrejection sampling, all of the samples generated are retained.\nIt will often be the case that the distribution p(z) can only be evaluated up to a\nnormalization constant, so that p(z) = \u0004p(z)/Zp where \u0004p(z) can be evaluated easily,\nwhereas Zp is unknown. Similarly, we may wish to use an importance sampling\ndistribution q(z) = \u0004q(z)/Zq, which has the same property. We then have\nE[f]\n=\n\u0006\nf(z)p(z) dz\n=\nZq\nZp\n\u0006\nf(z)\u0004p(z)\n\u0004q(z)q(z) dz\n≃\nZq\nZp\n1\nL\nL\n\u0002\nl=1\n\u0004rlf(z(l)).\n(11.20)\nwhere \u0004rl = \u0004p(z(l))/\u0004q(z(l)). We can use the same sample set to evaluate the ratio\nZp/Zq with the result\nZp\nZq\n=\n1\nZq\n\u0006\n\u0004p(z) dz =\n\u0006 \u0004p(z)\n\u0004q(z)q(z) dz\n≃\n1\nL\nL\n\u0002\nl=1\n\u0004rl\n(11.21)\nand hence\nE[f] ≃\nL\n\u0002\nl=1\nwlf(z(l))\n(11.22)\nwhere we have deﬁned\nwl =\n\u0004rl\n\u0005\nm \u0004rm\n=\n\u0004p(z(l))/q(z(l))\n\u0005\nm \u0004p(z(m))/q(z(m)).\n(11.23)\nAs with rejection sampling, the success of the importance sampling approach\ndepends crucially on how well the sampling distribution q(z) matches the desired"}]}, {"id": "gpt-oss:20b-cloud|extra-016", "question": "What does the word 'shift' refer to in the discussion, and what exactly changes?", "answer": "The “shift” in the discussion means a change in the statistical distribution that a model sees between training (source) and deployment (target).  It can involve one or more of the following distributions: the marginal input distribution P(X) (covariate shift), the marginal label distribution P(Y) (label shift), or the conditional distribution of labels given inputs P(Y|X) (concept drift).  In other words, a shift is the alteration of P(X), P(Y), or P(Y|X) (and consequently P(X|Y)) between the source and target data sets. [S1][S6][S4][S2]", "citations": [{"sid": "S1", "cite": "Huyen, Data Distribution Shifts > Types of Data Distribution Shifts, PDF p. 328", "text": "While data distribution shift is often used interchangeably with concept drift and covariate shift and occasionally\nlabel shift, these are three distinct subtypes of data shift. To understand what they mean, we first need to define a\ncouple of mathematical notations.\nLet’s call the inputs to a model X and its outputs Y. We know that in supervised learning, the training data can be\nviewed as a set of samples from the joint distribution P(X, Y) and then ML usually models P(Y|X). This joint\ndistribution P(X, Y) can be decomposed in two ways:\n1. P(X, Y) = P(Y|X)P(X)\n2. P(X, Y) = P(X|Y)P(Y)\nP(Y|X) denotes the conditional probability of an output given an input — for example, the probability of an email\nbeing spam given the content of the email. P(X) denotes the probability density of the input. P(Y) denotes the\nprobability density of the output. Label shift, covariate shift, and concept drift are defined as follows.\n\n\nCovariate shift is when P(X) changes, but P(Y|X) remains the same. This refers to the first\ndecomposition of the joint distribution.\nLabel shift is when P(Y) changes, but P(X|Y) remains the same. This refers to the second decomposition\nof the joint distribution.\nConcept drift is when P(Y|X) changes, but P(X) remains the same. This refers to the first decomposition\nof the joint distribution\n.\nIf you find this confusing, don’t panic. We’ll go over examples in the following section to illustrate their\ndifferences.\nCovariate Shift\nCovariate shift is one of the most widely studied forms of data distribution shift\n. In statistics, a covariate is an\nindependent variable that can influence the outcome of a given statistical trial, but which is not of direct interest.\nConsider that you are running an experiment to determine how locations affect the housing prices. The housing\nprice variable is your direct interest, but you know the square footage affects the price, so the square footage is a\ncovariate. In supervised ML, the label is the variable of direct interest, and the input features are covariate\nvariables.\nMathematically, covariate shift is when P(X) changes, but P(Y|X) remains the same, which means that the"}, {"sid": "S6", "cite": "Huyen, Data Distribution Shifts > Types of Data Distribution Shifts, PDF p. 329", "text": "price variable is your direct interest, but you know the square footage affects the price, so the square footage is a\ncovariate. In supervised ML, the label is the variable of direct interest, and the input features are covariate\nvariables.\nMathematically, covariate shift is when P(X) changes, but P(Y|X) remains the same, which means that the\ndistribution of the input changes, but the conditional probability of a label given an input remains the same.\nTo make this concrete, consider the task of detecting breast cancer. You know that the risk of breast cancer is\nhigher for women over the age of 40\n, so you have a variable “age” as your input. You might have more women\nover the age of 40 in your training data than in your inference data, so the input distributions differ for your\ntraining and inference data. However, for an example with a given age, such as above 40, the probability that this\nexample has breast cancer is constant. So P(Y|X), the probability of having breast cancer given age over 40, is the\nsame.\nDuring model development, covariate shifts can happen because of biases during the data selection process, which\ncould result from the difficulty in collecting examples for certain classes. For example, suppose that to study breast\ncancer, you get data from a clinic where women go in to test for breast cancer. Because people over 40 are\nencouraged by their doctors to get checkups, your data is dominated by women over 40. For this reason, covariate\nshift is closely related to the sample selection bias problem\n.\nCovariate shifts can also happen because the training data is artificially altered to make it easier for your model to\nlearn. As discussed in chapter 3, it’s hard for ML models to learn from imbalanced datasets, so you might want to\ncollect more samples of the rare classes or oversample your data on the rare classes to make it easier for your\nmodel to learn the rare classes.\nCovariate shift can also be caused by the model’s learning process, especially through active learning. In chapter 3,\nwe defined active learning as follows: instead of randomly selecting samples to train a model on, we use samples\nmost helpful to that model according to some heuristics. This means that the training input distribution is altered\nby the learning process to differ from the real-world input distribution, and covariate shifts are a by-product\n."}, {"sid": "S4", "cite": "Huyen, Data Distribution Shifts > Types of Data Distribution Shifts, PDF p. 328", "text": "Beat It\nRock\n1989\nMichael Jackson\nfancypants\nFalse\nNo\n \n              \n4\nIn Bloom\nRock\n1991\nNirvana\nfancypants\nTrue\nYes\n \n              \n5\nShallow\nPop\n2020\nLady Gaga\nlistenr32\nTrue\nYes\n \n            \nDuring inference, you want to predict whether a user will click on a song regardless of where the song is\nrecommended, so you might want to set the 1st Position feature to be False. Then you look at the model’s\npredictions for various songs for each user and can choose the order in which to show each song.\nThis is a naive example because doing this alone might not be enough to combat degenerative feedback loops. A\nmore sophisticated approach would be to use two different models. The first model predicts the probability that the\nuser will see and consider a recommendation taking into account the position of that recommendation. The second\nmodel then predicts the probability that the user will click on the item given that they saw and considered it. The\nsecond model doesn’t concern positions at all.\nData Distribution Shifts\nIn the previous section, we’ve discussed common causes for ML system failures. In this section, we’ll zero in onto\none especially sticky cause of failures: data distribution shifts, or data shifts for short. Data distribution shift refers\nto the phenomenon in supervised learning when the data a model works with changes over time, which causes this\nmodel’s predictions to become less accurate as time passes. The distribution of the data the model is trained on is\ncalled the source distribution. The distribution of the data the model runs inference on is called the target\ndistribution.\nEven though discussions around data distribution shift have only become common in recent years with the\ngrowing adoption of ML in the industry, data distribution shift in systems that learned from data has been studied\nas early as in 1986\n. There’s also a book on dataset distribution shifts by Quiñonero-Candela et al. published by\nMIT Press in 2008.\nTypes of Data Distribution Shifts\nWhile data distribution shift is often used interchangeably with concept drift and covariate shift and occasionally\nlabel shift, these are three distinct subtypes of data shift. To understand what they mean, we first need to define a\ncouple of mathematical notations.\nLet’s call the inputs to a model X and its outputs Y. We know that in supervised learning, the training data can be"}, {"sid": "S2", "cite": "Huyen, Data Distribution Shifts > General Data Distribution Shifts, PDF p. 330", "text": "However, not all covariate shifts result in label shifts. It’s a subtle point, so we’ll consider another example.\nImagine that there is now a preventive drug that every woman takes that helps reduce their chance of getting breast\ncancer. The probability P(Y|X) reduces for women of all ages, so it’s no longer a case of covariate shift. However,\ngiven a person with breast cancer, the age distribution remains the same, so this is still a case of label shift.\nBecause label shift is closely related to covariate shift, methods for detecting and adapting models to label shifts\nare similar to covariate shift adaptation methods. We’ll discuss them more in the Handling Data Shifts section\nbelow.\nConcept Drift\nConcept drift, also known as posterior shift, is when the input distribution remains the same but the conditional\ndistribution of the output given an input changes. You can think of this as “same input, different output”. Consider\nyou’re in charge of a model that predicts the price of a house based on its features. Before COVID-19, a 3\nbedroom apartment in San Francisco could cost $2,000,000. However, at the beginning of COVID-19, many\npeople left San Francisco, so the same house would cost only $1,500,000. So even though the distribution of house\nfeatures remains the same, the conditional distribution of the price of a house given its features has changed.\nIn many cases, concept drifts are cyclic or seasonal. For example, rideshare’s prices will fluctuate on weekdays\nversus weekends, and flight tickets rise during holiday seasons. Companies might have different models to deal\nwith cyclic and seasonal drifts. For example, they might have one model to predict rideshare prices on weekdays\nand another model for weekends.\nGeneral Data Distribution Shifts\nThere are other types of changes in the real-world that, even though not well-studied in research, can still degrade\nyour models’ performance.\nOne is feature change, such as when new features are added, older features are removed, or the set of all possible\nvalues of a feature changes\n. For example, your model was using years for the “age” feature, but now it uses"}]}, {"id": "gpt-oss:20b-cloud|cand-057", "question": "What does Goodfellow mean by intractable inference, and why does it become difficult in high-dimensional distributions?", "answer": "Goodfellow defines **intractable inference** as the need to compute conditional probabilities or expectations over latent variables that require summing over all possible values of other latent variables and a normalizing constant (the partition function) [S1]. In most deep models the posterior \\(p(h\\mid v)\\) is not analytically tractable; exact inference would require", "citations": [{"sid": "S1", "cite": "Goodfellow, Part III: Deep Learning Research, p. 487", "text": "with the number of dimensions.\nWith probabilistic models, this computational challenge arises from the need to\nperform intractable inference or simply from the need to normalize the distribution.\n• Intractable inference: inference is discussed mostly in chapter\n. It regards\n19\nthe question of guessing the probable values of some variables a, given other\nvariables b, with respect to a model that captures the joint distribution over\n\n\na, b and c. In order to even compute such conditional probabilities one needs\nto sum over the values of the variables c, as well as compute a normalization\nconstant which sums over the values of a and c.\n• Intractable normalization constants (the partition function): the partition\nfunction is discussed mostly in chapter\n. Normalizing constants of proba-\n18\nbility functions come up in inference (above) as well as in learning. Many\nprobabilistic models involve such a normalizing constant. Unfortunately,\nlearning such a model often requires computing the gradient of the logarithm of the partition function with respect to the model parameters. That\ncomputation is generally as intractable as computing the partition function\nitself. Monte Carlo Markov chain (MCMC) methods (chapter\n) are of-\n17\nten used to deal with the partition function (computing it or its gradient).\nUnfortunately, MCMC methods suﬀer when the modes of the model distribution are numerous and well-separated, especially in high-dimensional spaces\n(section\n).\n17.5\nOne way to confront these intractable computations is to approximate them,\nand many approaches have been proposed as discussed in this third part of the\nbook.\nAnother interesting way, also discussed here, would be to avoid these\nintractable computations altogether by design, and methods that do not require\nsuch computations are thus very appealing. Several generative models have been\nproposed in recent years, with that motivation. A wide variety of contemporary\napproaches to generative modeling are discussed in chapter\n.\n20\nPart\nis the most important for a researcher—someone who wants to un-\nIII\nderstand the breadth of perspectives that have been brought to the ﬁeld of deep\nlearning, and push the ﬁeld forward towards true artiﬁcial intelligence."}]}, {"id": "llama3.2:3b|cand-061", "question": "What does epsilon control in SVM regression, what does degree control in PolynomialFeatures, and how can increasing each affect the fitted model?", "answer": "[S1] Géron, Chapter 5. Support Vector Machines > SVM Regression, p. 166\n\nIn SVM regression, epsilon (ε) controls the ϵ-insensitivity of the model, meaning that adding more training instances within the margin does not affect the model's predictions.\n\n[S3] Géron, Chapter 4. Training Models > PolynomialFeatures, p. 134\n\nIn PolynomialFeatures, degree controls the number of new features added to the original feature set. Increasing the degree adds more features, including combinations of features up to the given degree.\n\nIncreasing the degree in PolynomialFeatures can lead to overfitting, as the model becomes more complex and may fit the training data too closely. Conversely, decreasing the degree can lead to underfitting, as the model becomes less complex and may not capture the underlying relationships in the data.\n\nIncreasing epsilon in SVM regression can lead to a more relaxed margin, allowing the model to fit the training data more closely. Increasing the degree in PolynomialFeatures can lead to a more complex model, potentially capturing more complex relationships in the data.", "citations": [{"sid": "S1", "cite": "Géron, Chapter 5. Support Vector Machines > SVM Regression, p. 166", "text": "Figure 5-10. SVM Regression\nAdding more training instances within the margin does not affect the model’s predic‐\ntions; thus, the model is said to be ϵ-insensitive.\nYou can use Scikit-Learn’s LinearSVR class to perform linear SVM Regression. The\nfollowing code produces the model represented on the left of Figure 5-10 (the train‐\ning data should be scaled and centered first):\nfrom sklearn.svm import LinearSVR\nsvm_reg = LinearSVR(epsilon=1.5)\nsvm_reg.fit(X, y)\nTo tackle nonlinear regression tasks, you can use a kernelized SVM model. For exam‐\nple, Figure 5-11 shows SVM Regression on a random quadratic training set, using a\n2nd-degree polynomial kernel. There is little regularization on the left plot (i.e., a large\nC value), and much more regularization on the right plot (i.e., a small C value).\nFigure 5-11. SVM regression using a 2nd-degree polynomial kernel\nSVM Regression"}, {"sid": "S3", "cite": "Géron, Chapter 4. Training Models > Learning Curves, p. 134", "text": "two features a and b, PolynomialFeatures with degree=3 would not only add the\nfeatures a2, a3, b2, and b3, but also the combinations ab, a2b, and ab2.\nPolynomialFeatures(degree=d) transforms an array containing n\nfeatures into an array containing n + d !\nd! n!  features, where n! is the\nfactorial of n, equal to 1 × 2 × 3 × ⋯ × n. Beware of the combinato‐\nrial explosion of the number of features!\nLearning Curves\nIf you perform high-degree Polynomial Regression, you will likely fit the training\ndata much better than with plain Linear Regression. For example, Figure 4-14 applies\na 300-degree polynomial model to the preceding training data, and compares the\nresult with a pure linear model and a quadratic model (2nd-degree polynomial).\nNotice how the 300-degree polynomial model wiggles around to get as close as possi‐\nble to the training instances.\nFigure 4-14. High-degree Polynomial Regression\nOf course, this high-degree Polynomial Regression model is severely overfitting the\ntraining data, while the linear model is underfitting it. The model that will generalize\nbest in this case is the quadratic model. It makes sense since the data was generated\nusing a quadratic model, but in general you won’t know what function generated the\ndata, so how can you decide how complex your model should be? How can you tell\nthat your model is overfitting or underfitting the data?\n134 \nChapter 4: Training Models"}]}, {"id": "gpt-oss:20b-cloud|cand-033", "question": "Which three categories of nodes are included in the Markov blanket of xi?", "answer": "The Markov blanket of a node \\(x_i\\) consists of its **parents, children, and co‑parents** (other parents of its children). [S1]", "citations": [{"sid": "S1", "cite": "Bishop, 8.3. Markov Random Fields > 8.3.1 Conditional independence properties, p. 383", "text": "8.3. Markov Random Fields\nFigure 8.26\nThe Markov blanket of a node xi comprises the set\nof parents, children and co-parents of the node. It\nhas the property that the conditional distribution of\nxi, conditioned on all the remaining variables in the\ngraph, is dependent only on the variables in the\nMarkov blanket.\nxi\nof xi as well as on the co-parents, in other words variables corresponding to parents\nof node xk other than node xi. The set of nodes comprising the parents, the children\nand the co-parents is called the Markov blanket and is illustrated in Figure 8.26. We\ncan think of the Markov blanket of a node xi as being the minimal set of nodes that\nisolates xi from the rest of the graph. Note that it is not sufﬁcient to include only the\nparents and children of node xi because the phenomenon of explaining away means\nthat observations of the child nodes will not block paths to the co-parents. We must\ntherefore observe the co-parent nodes also.\n8.3. Markov Random Fields\nWe have seen that directed graphical models specify a factorization of the joint distribution over a set of variables into a product of local conditional distributions. They\nalso deﬁne a set of conditional independence properties that must be satisﬁed by any\ndistribution that factorizes according to the graph. We turn now to the second major class of graphical models that are described by undirected graphs and that again\nspecify both a factorization and a set of conditional independence relations.\nA Markov random ﬁeld, also known as a Markov network or an undirected\ngraphical model (Kindermann and Snell, 1980), has a set of nodes each of which\ncorresponds to a variable or group of variables, as well as a set of links each of\nwhich connects a pair of nodes. The links are undirected, that is they do not carry\narrows. In the case of undirected graphs, it is convenient to begin with a discussion\nof conditional independence properties.\n8.3.1\nConditional independence properties\nIn the case of directed graphs, we saw that it was possible to test whether a par-\nSection 8.2\nticular conditional independence property holds by applying a graphical test called\nd-separation. This involved testing whether or not the paths connecting two sets of"}]}, {"id": "gpt-oss:20b-cloud|cand-067", "question": "What parameter count does Raschka give for the smallest GPT-2 model in the comparison?", "answer": "Raschka lists the smallest GPT‑2 model (“gpt2‑small”) as having **124 million parameters** in the comparison of model sizes. [S6]", "citations": [{"sid": "S6", "cite": "Raschka, 5 Pretraining on unlabeled data > 5.5 Loading pretrained weights from OpenAI, p. 162", "text": "5.5\nLoading pretrained weights from OpenAI\n [ 0.05135201 ...   0.00704835  0.15519823  0.12067825]]\nToken embedding weight tensor dimensions: (50257, 768)\nWe downloaded and loaded the weights of the smallest GPT-2 model via the download_\nand_load_gpt2(model_size=\"124M\", ...) setting. OpenAI also shares the weights of\nlarger models: 355M, 774M, and 1558M. The overall architecture of these differently\nsized GPT models is the same, as illustrated in figure 5.17, except that different\nRepeat this transformer block:\n• 12 × in “gpt2-small”\n• 24 × in “gpt2-medium”\n• 36 × in “gpt2-large”\n• 48 × in “gpt2-xl”\nNumber of heads in\nmulti-head attention:\n• 12 in “gpt2-small”\n• 16 in “gpt2-medium”\n• 20 in “gpt2-large”\n• 25 in gpt2-xl”\n“\nEmbedding dimensions:\n• 768 in “gpt2-small”\n• 1,024 in “gpt2-medium”\n• 1,280 in “gpt2-large”\n• 1,600 in “gpt2-xl”\nGPT\nmodel\nMasked multi-head\nattention\nLayerNorm 2\nFeed forward\nLayerNorm 1\nDropout\nDropout\nToken embedding layer\nTokenized text\nEvery effort moves you\nFinal LayerNorm\nLinear output layer\nN\nDropout\nPositional embedding layer\nTotal number of parameters:\n• 124 M in “gpt2-small”\n• 355 M in “gpt2-medium”\n• 774 M in “gpt2-large”\n• 1558 M in “gpt2-xl”\nFigure 5.17\nGPT-2 LLMs come in several different model sizes, ranging from 124 million to 1,558 million \nparameters. The core architecture is the same, with the only difference being the embedding sizes and the number \nof times individual components like the attention heads and transformer blocks are repeated."}]}, {"id": "llama3.2:3b|cand-018", "question": "For K=4 states and a third-order Markov chain, how many free conditional-probability parameters result under the formula given?", "answer": "[S1][S4]\n\nFor a third-order Markov chain, the number of free conditional-probability parameters is KM−1(K −1), where M = 3. For K = 4 states, the number of parameters is 3(4 − 1) = 9.", "citations": [{"sid": "S1", "cite": "Bishop, 13. Sequential Data > 13.1. Markov Models, p. 609", "text": "zn+1\nxn−1\nxn\nxn+1\nz1\nz2\nx1\nx2\nEach observation is now inﬂuenced by two previous observations. We can similarly\nconsider extensions to an M th order Markov chain in which the conditional distribution for a particular variable depends on the previous M variables. However, we\nhave paid a price for this increased ﬂexibility because the number of parameters in\nthe model is now much larger. Suppose the observations are discrete variables having K states. Then the conditional distribution p(xn|xn−1) in a ﬁrst-order Markov\nchain will be speciﬁed by a set of K −1 parameters for each of the K states of xn−1\ngiving a total of K(K −1) parameters. Now suppose we extend the model to an\nM th order Markov chain, so that the joint distribution is built up from conditionals\np(xn|xn−M, . . . , xn−1). If the variables are discrete, and if the conditional distributions are represented by general conditional probability tables, then the number\nof parameters in such a model will have KM−1(K −1) parameters. Because this\ngrows exponentially with M, it will often render this approach impractical for larger\nvalues of M.\nFor continuous variables, we can use linear-Gaussian conditional distributions\nin which each node has a Gaussian distribution whose mean is a linear function\nof its parents. This is known as an autoregressive or AR model (Box et al., 1994;\nThiesson et al., 2004). An alternative approach is to use a parametric model for\np(xn|xn−M, . . . , xn−1) such as a neural network.\nThis technique is sometimes\ncalled a tapped delay line because it corresponds to storing (delaying) the previous\nM values of the observed variable in order to predict the next value. The number\nof parameters can then be much smaller than in a completely general model (for example it may grow linearly with M), although this is achieved at the expense of a\nrestricted family of conditional distributions.\nSuppose we wish to build a model for sequences that is not limited by the\nMarkov assumption to any order and yet that can be speciﬁed using a limited number\nof free parameters. We can achieve this by introducing additional latent variables to"}, {"sid": "S4", "cite": "Bishop, 13. Sequential Data > 13.1. Markov Models, p. 609", "text": "of parameters can then be much smaller than in a completely general model (for example it may grow linearly with M), although this is achieved at the expense of a\nrestricted family of conditional distributions.\nSuppose we wish to build a model for sequences that is not limited by the\nMarkov assumption to any order and yet that can be speciﬁed using a limited number\nof free parameters. We can achieve this by introducing additional latent variables to\npermit a rich class of models to be constructed out of simple components, as we did\nwith mixture distributions in Chapter 9 and with continuous latent variable models in\nChapter 12. For each observation xn, we introduce a corresponding latent variable\nzn (which may be of different type or dimensionality to the observed variable). We\nnow assume that it is the latent variables that form a Markov chain, giving rise to the\ngraphical structure known as a state space model, which is shown in Figure 13.5. It\nsatisﬁes the key conditional independence property that zn−1 and zn+1 are independent given zn, so that\nzn+1 ⊥⊥zn−1 | zn.\n(13.5)"}]}, {"id": "llama3.2:3b|cand-051", "question": "How does out-of-bag evaluation estimate bagging performance without a separate validation set?", "answer": "[S1] states that with bagging, some instances may be sampled several times for any given predictor, while others may not be sampled at all. By default, a BaggingClassifier samples m training instances with replacement (bootstrap=True), where m is the size of the training set. This means that only about 63% of the training instances are sampled on average for each predictor. The remaining 37% of the training instances that are not sampled are called out-of-bag (oob) instances. \n\nOut-of-bag evaluation estimates bagging performance without a separate validation set by using the oob instances, which are not seen during training.", "citations": [{"sid": "S1", "cite": "Géron, Bagging and Pasting > Out-of-Bag Evaluation, p. 199", "text": "6 As m grows, this ratio approaches 1 – exp(–1) ≈ 63.212%.\nFigure 7-5. A single Decision Tree versus a bagging ensemble of 500 trees\nBootstrapping introduces a bit more diversity in the subsets that each predictor is\ntrained on, so bagging ends up with a slightly higher bias than pasting, but this also\nmeans that predictors end up being less correlated so the ensemble’s variance is\nreduced. Overall, bagging often results in better models, which explains why it is gen‐\nerally preferred. However, if you have spare time and CPU power you can use crossvalidation to evaluate both bagging and pasting and select the one that works best.\nOut-of-Bag Evaluation\nWith bagging, some instances may be sampled several times for any given predictor,\nwhile others may not be sampled at all. By default a BaggingClassifier samples m\ntraining instances with replacement (bootstrap=True), where m is the size of the\ntraining set. This means that only about 63% of the training instances are sampled on\naverage for each predictor.6 The remaining 37% of the training instances that are not\nsampled are called out-of-bag (oob) instances. Note that they are not the same 37%\nfor all predictors.\nSince a predictor never sees the oob instances during training, it can be evaluated on\nthese instances, without the need for a separate validation set. You can evaluate the\nensemble itself by averaging out the oob evaluations of each predictor.\nIn Scikit-Learn, you can set oob_score=True when creating a BaggingClassifier to\nrequest an automatic oob evaluation after training. The following code demonstrates\nthis. The resulting evaluation score is available through the oob_score_ variable:\n>>> bag_clf = BaggingClassifier(\n...     DecisionTreeClassifier(), n_estimators=500,\n...     bootstrap=True, n_jobs=-1, oob_score=True)\n...\n>>> bag_clf.fit(X_train, y_train)\nBagging and Pasting"}]}, {"id": "gpt-oss:20b-cloud|cand-050", "question": "In Jurafsky's lake-species illustration, what probability does Good-Turing assign to an unseen species?", "answer": "Good‑Turing assigns a probability of  \n\n\\[\nP^*_{\\text{GT}}(\\text{unseen species})=\\frac{N_1}{N}=\\frac{3}{18}\\approx0.17\n\\]\n\nto any species that has never been seen in the training set. [S1][S2]", "citations": [{"sid": "S1", "cite": "Jurafsky, 4.5 SMOOTHING > 4.5.2 Good-Turing Discounting, PDF p. 112", "text": "is the total number of items we have seen in training. Equation (4.27) thus gives the\nprobability that the N + 1st bigram we see will be one that we never saw in training.\nShowing that (Equation (4.27)) follows from (Equation (4.26)) is left as Exercise 4.8\nfor the reader.\nThe Good-Turing method was ﬁrst proposed for estimating the populations of animal species. Let’s consider an illustrative example from this domain created by Joshua\nGoodman and Stanley Chen. Suppose we are ﬁshing in a lake with 8 species (bass,\ncarp, catﬁsh, eel, perch, salmon, trout, whiteﬁsh) and we have seen 6 species with the\nfollowing counts: 10 carp, 3 perch, 2 whiteﬁsh, 1 trout, 1 salmon, and 1 eel (so we\nhaven’t yet seen the catﬁsh or bass). What is the probability that the next ﬁsh we catch\nwill be a new species, i.e., one that had a zero frequency in our training set, i.e., in this\ncase either a catﬁsh or a bass?\nThe MLE count c of a hitherto-unseen species (bass or catﬁsh) is 0. But Equation (4.27) tells us that the probability of a new ﬁsh being one of these unseen species\nis 3\n18, since N1 is 3 and N is 18:\nP∗\nGT(things with frequency zero in training) = N1\nN = 3\n18\n(4.28)\nWhat is the probability that the next ﬁsh will be another trout? The MLE count\nfor trout is 1, so the MLE estimated probability is\n1\n18. But the Good-Turing estimate\nmust be lower, since we just stole 3\n18 of our probability mass to use on unseen events!\nWe’ll need to discount the MLE probabilities for trout, perch, carp, etc. In summary,\nthe revised counts c∗and Good-Turing smoothed probabilities p∗\nGT for species with\ncount 0 (like bass or catﬁsh) or count 1 (like trout, salmon, or eel) are as follows:\nunseen (bass or catﬁsh)\ntrout"}, {"sid": "S2", "cite": "Jurafsky, 4.5 SMOOTHING > 4.5.2 Good-Turing Discounting, PDF p. 112", "text": "We’ll need to discount the MLE probabilities for trout, perch, carp, etc. In summary,\nthe revised counts c∗and Good-Turing smoothed probabilities p∗\nGT for species with\ncount 0 (like bass or catﬁsh) or count 1 (like trout, salmon, or eel) are as follows:\nunseen (bass or catﬁsh)\ntrout\nc\n0\n1\nMLE p\np = 0\n18 = 0\n1\n18\nc∗\nc∗(trout)= 2 × N2\nN1 = 2 × 1\n3 = .67\nGT p∗\nGT\np∗\nGT(unseen) = N1\nN = 3\n18 = .17 p∗\nGT(trout) = .67\n18 = 1\n27 = .037\nNote that the revised count c∗for eel was discounted from c = 1.0 to c∗= .67, (thus\nleaving some probability mass p∗\nGT(unseen) = 3\n18 = .17 for the catﬁsh and bass). And\nsince we know there were 2 unknown species, the probability of the next ﬁsh being\nspeciﬁcally a catﬁsh is p∗\nGT(catﬁsh) = 1\n2 × 3\n18 = .085.\nFig. 4.8 gives two examples of the application of Good-Turing discounting to bigram grammars, one on the BeRP corpus of 9332 sentences, and a larger example computed from 22 million words from the Associated Press (AP) newswire by Church and\nGale (1991) . For both examples the ﬁrst column shows the count c, i.e., the number of\nobserved instances of a bigram. The second column shows the number of bigrams that"}]}];
const KEY = "judge_labels_v1";
let L = {}; try { L = JSON.parse(localStorage.getItem(KEY) || "{}"); } catch(e) {}
const esc = s => s.replace(/[&<>]/g, c => ({"&":"&amp;","<":"&lt;",">":"&gt;"}[c]));
function hi(t){ return esc(t).replace(/\[(S\d+)\]/gi, '<mark>[$1]</mark>'); }
function set(k, v){ L[k] = v; try{localStorage.setItem(KEY, JSON.stringify(L));}catch(e){} draw(); }
function draw(){
  let total = 0, done = 0, h = "";
  ITEMS.forEach((it, i) => {
    h += `<div class="card"><div class="q">${i+1}. ${esc(it.question)}</div>`;
    h += `<div class="a">${hi(it.answer)}</div>`;
    it.citations.forEach(c => {
      const k = it.id + "|" + c.sid; total++; if (L[k]) done++;
      h += `<div class="cite"><b>[${c.sid}]</b> ${esc(c.cite)}<div class="src">${esc(c.text)}</div>`;
      ["supported","partial","unsupported"].forEach(v =>
        h += `<button class="${L[k]===v?'on':''}" onclick="set('${k.replace(/'/g,"\\'")}','${v}')">${v}</button>`);
      h += `</div>`;
    });
    h += `</div>`;
  });
  document.getElementById("list").innerHTML = h;
  document.getElementById("prog").textContent = ` · ${done}/${total} labelled`;
}
function exp(){
  const lines = Object.entries(L).map(([k, v]) => {
    const [model, qid, sid] = k.split("|");
    return JSON.stringify({model, qid, sid, label: v});
  });
  const b = new Blob([lines.join("\n") + "\n"], {type: "application/json"});
  const a = document.createElement("a"); a.href = URL.createObjectURL(b);
  a.download = "judge_labels.jsonl"; a.click();
}
draw();
</script></body></html>
